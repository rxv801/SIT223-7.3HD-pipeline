# Prometheus configuration for the Taskmaster CV worker.
#
#   prometheus --config.file=monitoring/prometheus.yml
#
# Scrapes both environments so staging and production can be compared, and so
# an alert can distinguish "this release is broken" from "everything is down".

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: taskmaster-prod
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8765"]
        labels:
          environment: production

  - job_name: taskmaster-staging
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8766"]
        labels:
          environment: staging

  # Prometheus scraping itself — cheap, and it makes "is the monitoring alive"
  # answerable from the same place as everything else.
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
