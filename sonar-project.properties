sonar.projectKey=rxv801_SIT223-7.3HD-pipeline
sonar.organization=rxv801
sonar.host.url=https://sonarcloud.io

sonar.projectName=Taskmaster CV Worker
sonar.sourceEncoding=UTF-8

# Analyse the worker itself; tests are declared separately so their own code is
# not scored as production code.
sonar.sources=main.py,cv
sonar.tests=tests
sonar.python.version=3.11

# Coverage comes from the Test stage (scripts/test.sh), which must run first.
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.junit.reportPaths=reports/junit.xml

# Build output and caches. models/ holds two large binary models fetched at
# build time; test_assets/ holds fixture JPEGs. Neither is source.
sonar.exclusions=dist/**,build/**,models/**,test_assets/**,**/__pycache__/**,scripts/pythonpath/**

# Manual harnesses kept from the original project. They are run by hand with an
# image path, superseded by tests/, and excluded from coverage in .coveragerc —
# so scoring them for coverage here would contradict that.
sonar.coverage.exclusions=cv/*_test.py,cv/camera.py,cv/detection_loop.py
